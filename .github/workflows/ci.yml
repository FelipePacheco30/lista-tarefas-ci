name: CI

# Passo 1 — Gatilho: o pipeline roda a cada pull request aberto ou atualizado para a main.
on:
  pull_request:
    branches: [main]

jobs:
  # Passo 2 — Análise estática (ESLint) e verificação de formatação (Prettier).
  qualidade:
    name: Análise estática e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Passo 3 — Build: gera o bundle de produção e guarda a pasta dist/ como artefato.
  build:
    name: Build
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
